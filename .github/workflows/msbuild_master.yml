name: MSBuild_Master

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: 2026_Graphics.sln
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: x64

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: "[18.0,19.0)"
          vs-prerelease: true
          msbuild-architecture: x64

      - name: Build
        run: msbuild "$env:SOLUTION_FILE_PATH" /m /t:Build /p:Configuration="$env:BUILD_CONFIGURATION" /p:Platform="$env:BUILD_PLATFORM" /p:PreferredToolArchitecture=x64 /verbosity:minimal
