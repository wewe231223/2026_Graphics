SceneName: DefaultScene
Systems:
  - CameraInputSystem
  - PickingSystem
  - StaticRenderSystem
  - CleanUpSystem
  - CameraRenderSystem

DefaultTransform: &DefaultTransform
  rotationEuler: [0.0, 0.0, 0.0]
  rotation: [0.0, 0.0, 0.0, 1.0]
  scale: [1.0, 1.0, 1.0]

DefaultStaticMeshRenderer: &DefaultStaticMeshRenderer
  modelPath: testset.bin

DefaultMaterial: &DefaultMaterial
  materialPath: testset_materials.json

model1 : &model1
  modelPath: testset2.bin

mat1 : &mat1
  materialPath: testset2_materials.json

PrimitiveBoxRenderer: &PrimitiveBoxRenderer
  modelPrimitive: primitive:box
  modelPrimitiveSize: 1.37
  modelPrimitiveColor: [0.91, 0.23, 0.48, 1.0]

PrimitiveSphereRenderer: &PrimitiveSphereRenderer
  modelPrimitive: primitive:sphere
  modelPrimitiveSize: 0.84
  modelPrimitiveColor: [0.17, 0.79, 0.63, 1.0]

PrimitiveCylinderRenderer: &PrimitiveCylinderRenderer
  modelPrimitive: primitive:cylinder
  modelPrimitiveSize: 1.62
  modelPrimitiveColor: [0.34, 0.41, 0.92, 1.0]

PrimitiveConeRenderer: &PrimitiveConeRenderer
  modelPrimitive: primitive:cone
  modelPrimitiveSize: 1.11
  modelPrimitiveColor: [0.96, 0.66, 0.12, 1.0]

PrimitiveTriangularPyramidRenderer: &PrimitiveTriangularPyramidRenderer
  modelPrimitive: primitive:triangular_pyramid
  modelPrimitiveSize: 1.48
  modelPrimitiveColor: [0.58, 0.19, 0.87, 1.0]

PrimitiveSquarePyramidRenderer: &PrimitiveSquarePyramidRenderer
  modelPrimitive: primitive:square_pyramid
  modelPrimitiveSize: 0.95
  modelPrimitiveColor: [0.24, 0.93, 0.31, 1.0]

Entities:
  - Components:
      Name:
        text: MainCamera
      Transform:
        <<: *DefaultTransform
        position: [0.0, 12.0, -18.0]
      Camera:
        fov: 60.0
        aspectRatio: 1.777777
        nearPlane: 0.1
        farPlane: 1000.0
        isActive: true
        isOrthographic: false
        orthoSize: 5.0
        cullingMask: 4294967295
        clearColor: [0.1, 0.1, 0.1, 1.0]
        priority: 0
        smoothingFactor: 0.1
        currentFovBias: 0.0
        currentShakeIntensity: 0.0
        lockOnTargetIndex: 4294967295
        lockOnTargetGeneration: 4294967295
        cameraFlags: 2
      CameraIntent:
        moveDirection: [0.0, 0.0, 0.0]
        lookDelta: [0.0, 0.0]
        zoomDelta: 0.0
        targetToLockOnIndex: 4294967295
        targetToLockOnGeneration: 4294967295
        requestUnlock: false
        requestSkip: false
        shakeImpulse: 0.0
  - Components:
      Name:
        text: TestSetRoot
      Transform:
        <<: *DefaultTransform
        position: [-5.00, 0.00, -50.00]
      StaticMeshRenderer:
        <<: *DefaultStaticMeshRenderer
      Material:
        <<: *DefaultMaterial
  - Components:
      Name:
        text: TestSet2Root
      Transform:
        <<: *DefaultTransform
        position: [5.00, 0.00, -20.00]
      StaticMeshRenderer:
        <<: *model1
      Material:
        <<: *mat1
  - Components:
      Name:
        text: PrimitiveBox
      Transform:
        <<: *DefaultTransform
        position: [-10.00, 0.00, -12.00]
      StaticMeshRenderer:
        <<: *PrimitiveBoxRenderer
      Material:
        <<: *DefaultMaterial
  - Components:
      Name:
        text: PrimitiveSphere
      Transform:
        <<: *DefaultTransform
        position: [-6.00, 0.00, -12.00]
      StaticMeshRenderer:
        <<: *PrimitiveSphereRenderer
      Material:
        <<: *DefaultMaterial
  - Components:
      Name:
        text: PrimitiveCylinder
      Transform:
        <<: *DefaultTransform
        position: [-2.00, 0.00, -12.00]
      StaticMeshRenderer:
        <<: *PrimitiveCylinderRenderer
      Material:
        <<: *DefaultMaterial
  - Components:
      Name:
        text: PrimitiveCone
      Transform:
        <<: *DefaultTransform
        position: [2.00, 0.00, -12.00]
      StaticMeshRenderer:
        <<: *PrimitiveConeRenderer
      Material:
        <<: *DefaultMaterial
  - Components:
      Name:
        text: PrimitiveTriangularPyramid
      Transform:
        <<: *DefaultTransform
        position: [6.00, 0.00, -12.00]
      StaticMeshRenderer:
        <<: *PrimitiveTriangularPyramidRenderer
      Material:
        <<: *DefaultMaterial
  - Components:
      Name:
        text: PrimitiveSquarePyramid
      Transform:
        <<: *DefaultTransform
        position: [10.00, 0.00, -12.00]
      StaticMeshRenderer:
        <<: *PrimitiveSquarePyramidRenderer
      Material:
        <<: *DefaultMaterial
