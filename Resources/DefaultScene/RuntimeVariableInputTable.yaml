Variables:
  - Name: IsMoving
    Type: Bool
    InitialValue: false
  - Name: Speed
    Type: Float
    InitialValue: 0.0
  - Name: JumpTrigger
    Type: Trigger

InputBindings:
  - Key: W
    Event: Down
    Changes:
      - Name: IsMoving
        Type: Bool
        Value: true
      - Name: Speed
        Type: Float
        Value: 1.0
  - Key: W
    Event: Released
    Changes:
      - Name: IsMoving
        Type: Bool
        Value: false
      - Name: Speed
        Type: Float
        Value: 0.0
  - Key: Space
    Event: Pressed
    Changes:
      - Name: JumpTrigger
        Type: Trigger
