GraphName: KnightMainCharacter
ParameterDefinitions:
  - ParameterName: IsMoving
    ParameterType: Bool
    DefaultValue: false
  - ParameterName: CurrentSpeed
    ParameterType: Float
    DefaultValue: 0.0
  - ParameterName: DirectionDeltaDegrees
    ParameterType: Float
    DefaultValue: 0.0
  - ParameterName: Jump
    ParameterType: Trigger
    DefaultValue: false
  - ParameterName: IsLanding
    ParameterType: Trigger
    DefaultValue: false
  - ParameterName: IsRunning
    ParameterType: Bool
    DefaultValue: false

Nodes:
  - NodeName: Idle
    AnimationFile: knight.animbin
    ClipIndex: 0
    IsLoop: true
    PlaySpeed: 1.0
    IsDefault: true
  - NodeName: Walk
    AnimationFile: knight.animbin
    ClipIndex: 1
    IsLoop: true
    PlaySpeed: 1.0
    IsDefault: false
  - NodeName: Run
    AnimationFile: knight.animbin
    ClipIndex: 4
    IsLoop: true
    PlaySpeed: 2.0
    IsDefault: false
  - NodeName: Jump
    AnimationFile: knight.animbin
    ClipIndex: 2
    IsLoop: false
    PlaySpeed: 1.5
    IsDefault: false
  - NodeName: Land
    AnimationFile: knight.animbin
    ClipIndex: 3
    IsLoop: false
    PlaySpeed: 1.0
    IsDefault: false

Transitions:
  - FromNode: Idle
    ToNode: Jump
    HasExitTime: false
    ExitTimeNormalized: 0.0
    CanInterrupt: true
    Priority: 0
    BlendDuration: 0.05
    Conditions:
      - Parameter: Jump
        Operator: Equals
        BoolValue: true
  - FromNode: Walk
    ToNode: Jump
    HasExitTime: false
    ExitTimeNormalized: 0.0
    CanInterrupt: true
    Priority: 0
